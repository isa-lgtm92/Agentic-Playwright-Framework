name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          CI: true
      - name: Run SauceDemo tests with Allure results
        run: npm run test:allure
        env:
          CI: true
      - name: Generate Allure HTML report
        if: always()
        run: npm run allure:generate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-and-allure-reports
          path: |
            playwright-report/
            test-results/
            allure-results/
            allure-report/
          if-no-files-found: ignore
          retention-days: 14
